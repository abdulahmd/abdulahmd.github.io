<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | Abdullah Ahmed</title>
<meta name="description" content="Notes from Abdullah Ahmed on robotics, philosophy and music.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Ccircle cx='32' cy='32' r='13' fill='white'/%3E%3Cellipse cx='32' cy='32' rx='27' ry='7' fill='none' stroke='white' stroke-width='3' transform='rotate(-25 32 32)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="blog/blog.css">
</head>
<body>
<nav aria-label="Primary">
  <a class="mark" href="index.html">AA</a>
  <ul>
    <li><a href="index.html#experience">Work</a></li>
    <li><a href="index.html#offhours">Off hours</a></li>
    <li><a href="blog.html" aria-current="page">Blog</a></li>
  </ul>
</nav>

<main class="col">
  <h1>Blog</h1>
  <p class="lede">Robots, philosophy, music, and whatever's on my mind.</p>

  <ul class="filters" aria-label="Filter posts by topic">
    <li><button type="button" data-tag="all" aria-pressed="true">All</button></li>
    <li><button type="button" data-tag="engineering" aria-pressed="false">Engineering</button></li>
    <li><button type="button" data-tag="philosophy" aria-pressed="false">Philosophy</button></li>
    <li><button type="button" data-tag="music" aria-pressed="false">Music</button></li>
  </ul>

  <!-- To add a post: copy blog/_template.html to blog/<slug>.html, write it, then add an <li> here (newest first). -->
  <ul class="posts" id="posts">
    <li data-tag="philosophy">
      <a href="blog/first-post.html">
        <div class="meta">[Date]<br>Philosophy</div>
        <div>
          <h2>[First post title]</h2>
          <p>[One-sentence summary of the post.]</p>
        </div>
      </a>
    </li>
  </ul>
  <p class="empty" id="empty" hidden>Nothing here yet.</p>
</main>

<footer>© <span id="yr"></span> Abdullah Ahmed</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

const buttons = [...document.querySelectorAll('.filters button')];
const posts = [...document.querySelectorAll('#posts li')];
const empty = document.getElementById('empty');
buttons.forEach(b => b.addEventListener('click', () => {
  const tag = b.dataset.tag;
  buttons.forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  let shown = 0;
  posts.forEach(p => { const on = tag === 'all' || p.dataset.tag === tag; p.hidden = !on; shown += on; });
  empty.hidden = shown > 0;
}));
</script>
</body>
</html>
